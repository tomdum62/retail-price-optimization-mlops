# =============================================================================
# REGLES METIER — Pricing Retail SCAFLF Fruits & Legumes
# =============================================================================
# Ce fichier centralise TOUTES les regles metier pilotables par le metier.
# Aucune modification de code n'est necessaire pour ajuster ces parametres.
# Historique des modifications : utiliser git blame sur ce fichier.
#
# REFERENCE : repo pricing-algo (genese) — src/config.py
# =============================================================================


# -----------------------------------------------------------------------------
# 1. TAXONOMIE PRODUITS
# -----------------------------------------------------------------------------
# TROIS populations distinctes :
#   - SUIVI     : assortiment de base, optimise par le modele Monte Carlo
#   - NON SUIVI : operations promotionnelles, levier de perequation, JAMAIS touche
#   - POLCO     : prix contraints nationaux (INTERMARCHE only), JAMAIS touche
#
produits:
  suivis:
    description: >
      Assortiment de base stable. C'est eux qu'on optimise.
      Le modele Monte Carlo genere des scenarios (PVC, PC) pour chaque
      produit x base et selectionne le meilleur via scoring multi-criteres.
    source: "referentiel_produits"
    filtre_colonne: "Maille_Suivi"
    valeur_filtre: "SUIVI"
    politique_prix: "optimisation"

  non_suivis:
    description: >
      Operations promotionnelles. Leur marge est un levier d'ajustement
      pour atteindre l'objectif MLNI global (perequation).
      Le modele ne touche JAMAIS leurs prix.
    filtre_colonne: "Maille_Suivi"
    valeur_filtre: "NON SUIVI"
    politique_prix: "passthrough"

  polco:
    description: >
      Prix contraints nationaux (fichiers PRICING_FFL_*.csv).
      INTERMARCHE uniquement. PVC impose, exclu de l'optimisation.
      Reporte a part dans les sorties.
    enseigne: "INTERMARCHE"
    source_fichiers: "PRICING_FFL_*.csv"
    format:
      separateur: ";"
      encoding: "windows-1252"
      colonnes: ["Type", "Enseigne", "Code_CPS", "Zone", "Prix_brut"]
    politique_prix: "impose"


# -----------------------------------------------------------------------------
# 2. ENSEIGNES & OBJECTIFS
# -----------------------------------------------------------------------------
enseignes:
  INTERMARCHE:
    MLNI_TAUX: 34.75                          # Objectif MLNI global (%)
    MADH_TAUX_MIN: 0.0                        # Marge adherent >= 0
    MFIL_TAUX_MIN: 0.0                        # Marge filiere >= 0
    concurrent_reference: "E.Leclerc"
    colonne_prix_concurrent: "Prix_Moyen_LCL"
    INDICE_CIBLE: 102.0                       # ITM vs E.Leclerc (base 100)

  NETTO:
    MLNI_TAUX: 29.25                          # Objectif MLNI global (%)
    MADH_TAUX_MIN: 0.0
    MFIL_TAUX_MIN: 0.0
    concurrent_reference: "Lidl"
    colonne_prix_concurrent: "Prix_Moyen_LIDL"
    INDICE_CIBLE: 100.0                       # Netto vs Lidl (parite)


# -----------------------------------------------------------------------------
# 3. FORMULES FINANCIERES
# -----------------------------------------------------------------------------
# CRITIQUES — ne pas modifier sans validation metier + recette complete
#
formules:
  tva_default_pct: 5.5                        # TVA Fruits & Legumes

  # Les 3 marges du modele SCAFLF :
  #   CA_TTC     = PVC                             (prix TTC consommateur)
  #   CA_HT      = PVC / (1 + TVA/100)
  #   MADH_Val   = CA_HT - PC                      (marge adherent)
  #   MFIL_Val   = PC - PA                          (marge filiere)
  #   MLNI_Val   = CA_HT - PA                       (marge ligne nette ITM)
  #
  # Taux :
  #   MADH_Taux  = MADH_Val / CA_TTC * 100          (denom CA TTC, pas CA HT !)
  #   MFIL_Taux  = MFIL_Val / Val_Cession * 100     (denom = PC)
  #   MLNI_Taux  = MLNI_Val / CA_TTC * 100           (denom CA TTC)
  #
  # Indice prix :
  #   Indice     = (PVC / Prix_Concurrent) * 100

  # Seuils d'alerte
  marge_aberrante_min_pct: -5.0               # marge < -5% = anomalie
  marge_aberrante_max_pct: 60.0               # marge > 60% = anomalie

  # Filiere exclue des indices prix
  filiere_horticole_code: 42


# -----------------------------------------------------------------------------
# 4. PEREQUATION SUIVI / NON SUIVI
# -----------------------------------------------------------------------------
perequation:
  actif: true
  description: >
    Mecanisme d'equilibrage : la marge totale (MLNI) est le mix entre
    SUIVI (base stable) et NON SUIVI (operations promo, levier d'ajustement).
      MLNI_total = (CA_suivi * MLNI_suivi + CA_ns * MLNI_ns) / CA_total
    Ce module calcule la marge NS requise pour atteindre l'objectif global,
    et derive les prix minimaux (PVC, PC) compatibles.

  # Granularite d'affichage (compatible DAX / Power BI)
  granularite:
    dimensions:
      - Semaine_FFL                           # semaine FFL (ISO week)
      - CODBAS                                # base logistique
      - Enseigne                              # INTERMARCHE | NETTO
    table_databricks: "perequation_details"

  # Colonnes de la matrice de perequation
  colonnes_matrice:
    group_keys:
      - Semaine_FFL
      - Annee_FFL
      - Num_Semaine
      - CODBAS
      - Nom_Base
      - Enseigne
    value_cols:
      - CA_TTC
      - CA_HT
      - Val_Cession
      - Val_Achat
      - MLNI_Val
      - MADH_Val
      - MFIL_Val
      - Qte_Reelle
    pivot_col: "Maille_Suivi"                 # SUIVI | NON SUIVI
    suffixes: ["_SUIVI", "_NS", "_TOTAL"]

  # Indicateurs derives
  indicateurs:
    - Part_NS_Pct                             # poids du NS dans le CA total
    - MLNI_NS_Requis                          # marge NS requise pour l'objectif
    - Ecart_MLNI_Total                        # ecart vs objectif
    - Sensibilite_1pt_NS                      # impact de +1pt NS sur le total
    - NS_Requis_Realiste                      # flag faisabilite

  # Lecture chunked (gros volumes)
  chunksize: 500000


# -----------------------------------------------------------------------------
# 5. MONTE CARLO — Optimisation des prix
# -----------------------------------------------------------------------------
monte_carlo:
  n_scenarios: 10000                          # tirages par produit x base
  pvc_variation_pct: 15.0                     # amplitude max autour du PVC actuel
  seed: 42                                    # reproductibilite

  # Scoring multi-criteres (somme ponderee, 0 a 1)
  scoring:
    poids:
      marge: 0.50                             # maximisation marge MLNI
      indice: 0.35                            # proximite a l'indice cible
      lissage: 0.15                           # penalite saut prix J→J+1

    # Score marge : echelle lineaire 0%→0, scale_max%→1
    marge_scale_max_pct: 50.0

    # Score indice : zone optimale ±2 pts, penalite au-dela
    indice_zone_optimale_pts: 2.0
    indice_penalite_au_dessus: 10.0           # -1 score sur 10 pts d'ecart
    indice_penalite_en_dessous: 20.0          # penalite legere si trop bas

    # Score lissage : seuil de penalite
    lissage_seuil_pct: 5.0                    # penalite si variation > 5% vs J-1

  # MLNI = resultat PORTEFEUILLE (perequation SUIVI+NS).
  # Le scorer maximise la marge sans cibler un taux MLNI par produit.
  mlni_floor_pct: 15.0                        # plancher pour bornes PVC du simulateur

  # Front de Pareto 2D (marge vs ecart a l'indice cible)
  pareto: true


# -----------------------------------------------------------------------------
# 6. CONTRAINTES DE PRIX
# -----------------------------------------------------------------------------
contraintes_prix:
  # Prix plancher (PVC_min) : derive de la marge MLNI cible
  # PVC_min = PA / (1/coef_tva - mlni_cible/100)
  prix_plancher:
    actif: true
    methode: "mlni_cible"                     # derive des objectifs par enseigne

  # Prix plafond (PVC_max) : indice vs concurrent
  # PVC_max = Prix_Concurrent * Indice_Cible / 100
  prix_plafond:
    actif: true
    methode: "indice_concurrent"

  # Bornes PC (prix de cession)
  # PC_min = PA           → MFIL >= 0 (filiere ne perd pas)
  # PC_max = CA_HT        → MADH >= 0 (adherent ne perd pas)
  bornes_pc:
    MFIL_min: 0.0                             # PC >= PA
    MADH_min: 0.0                             # PC <= CA_HT

  # Arrondi FL — paliers Fruits & Legumes
  arrondis:
    actif: true
    methode: "paliers_fl"                     # paliers X.X9 (0.99, 1.29, 1.49...)
    pas: 0.10                                 # grille de 10 centimes
    suffixe: 9                                # tous les PVC finissent en X.X9
    # 91% des PVC FL finissent en X.X9 (observation metier)
    # Pas de regle sur les prix de cession (PC)

  # Anti-volatilite (lissage inter-runs)
  stabilite:
    actif: true
    ecart_max_pct: 5.0                        # variation max entre 2 runs consecutifs


# -----------------------------------------------------------------------------
# 7. PREVISIONS VOLUME / CA
# -----------------------------------------------------------------------------
previsions:
  description: >
    Donnees de prevision de volume et CA, necessaires a la perequation
    et au mix volume potentiel.

  # Forecast V2 — grain produit (LightGBM)
  forecast:
    modele: "LightGBM"
    target: "Qte_Reelle"
    historique_min_jours: 14                  # par produit
    historique_min_semaines: 30               # pour entrainement global
    horizon_jours: 14
    parametres_lgbm:
      n_estimators: 1000
      max_depth: 8
      learning_rate: 0.03
      num_leaves: 127
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 20
      reg_alpha: 0.1
      reg_lambda: 1.0
    early_stopping_rounds: 50

  source:
    table_databricks: "previsions_volume_ca"
    colonnes_requises:
      - CODE_PRODUIT_STANDARD
      - CODBAS
      - Enseigne
      - Semaine_FFL
      - Qte_Pred
      - CA_Pred

  # Mix volume potentiel
  mix_volume:
    actif: true
    methode: "contribution_marginale"
    horizon_semaines: 4


# -----------------------------------------------------------------------------
