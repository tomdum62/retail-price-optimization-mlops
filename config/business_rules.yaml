# -----------------------------------------------------------------------------
# 9. SORTIE DATABRICKS
# -----------------------------------------------------------------------------
sortie:
  format: "databricks_table"                  # PAS de CSV — tables en dur

  tables:
    recommandations:
      nom: "reco_pricing"
      schema: "pricing"
      mode_ecriture: "append"
      colonnes_partition: [run_id, date_run, mode]
      colonnes_cles: [CODE_PRODUIT, CODBAS, Enseigne, Semaine_FFL]
      colonnes_sortie:
        - CODE_PRODUIT
        - CODBAS
        - Nom_Base
        - Enseigne
        - PA
        - PVC_Current
        - PVC_Optimal
        - PC_Optimal
        - Delta_PVC
        - Delta_PVC_Pct
        - MLNI_Prevu
        - MADH_Prevu
        - MFIL_Prevu
        - Indice_Prevu
        - Score
        - Is_Feasible
        - N_Feasible

    polco:
      nom: "polco_pricing"
      schema: "pricing"
      mode_ecriture: "append"
      colonnes_partition: [run_id, date_run]
      colonnes_cles: [CODE_PRODUIT_STANDARD, CODBAS, Enseigne, Semaine_FFL]

    perequation:
      nom: "perequation_details"
      schema: "pricing"
      mode_ecriture: "append"
      colonnes_partition: [run_id, date_run]
      colonnes_cles: [CODBAS, Enseigne, Semaine_FFL]

    synthese:
      nom: "synthese_pricing"
      schema: "pricing"
      mode_ecriture: "append"
      colonnes_partition: [run_id, date_run, mode]

    decomposition_marge:
      nom: "decomposition_marge_suivis"
      schema: "pricing"
      mode_ecriture: "append"
      colonnes_partition: [run_id, date_run]
      colonnes_cles: [CODE_PRODUIT, CODBAS, Enseigne, Semaine_FFL]

    portfolio_metrics:
      nom: "portfolio_metrics"
      schema: "pricing"
      description: >
        Metriques agregees par enseigne : indice CA comparable,
        MLNI portefeuille, nb produits, delta PVC moyen.
      mode_ecriture: "append"
      colonnes_partition: [run_id, date_run]

  archivage:
    actif: true
    retention_runs: 52                        # 1 an hebdo
    compression: "snappy"


# -----------------------------------------------------------------------------
# 10. SCHEDULING — Pipeline bi-hebdomadaire
# -----------------------------------------------------------------------------
scheduling:
  friday:
    description: "Run principal — indices frais du jeudi"
    forecast_horizon_jours: 7                 # jusqu'au jeudi suivant

  tuesday:
    description: "Reajustement — actuals du weekend + lundi"
    forecast_horizon_jours: 4                 # jusqu'au vendredi


# -----------------------------------------------------------------------------
# 11. MODES D'EXECUTION
# -----------------------------------------------------------------------------
modes:
  complet:
    description: "Run complet — tous produits, toutes bases, toutes enseignes"
    inclure_suivis: true
    inclure_polco: true                       # reporte a part, pas optimise
    perequation: true
    decomposition_marge: true

  simulation:
    description: "Dry run — calcul sans ecriture en table de prod"
    schema_sortie: "pricing_sandbox"
    inclure_suivis: true
    inclure_polco: true
    perequation: true
    decomposition_marge: true

  suivis_only:
    description: "Optimisation des suivis uniquement (sans POLCO report)"
    inclure_suivis: true
    inclure_polco: false
    perequation: true
    decomposition_marge: true


# -----------------------------------------------------------------------------
# 12. METEO (features forecast)
# -----------------------------------------------------------------------------
meteo:
  api_url: "https://api.open-meteo.com/v1/forecast"
  variables:
    - temperature_2m_max
    - temperature_2m_min
    - precipitation_sum
    - sunshine_duration
    - uv_index_max


# -----------------------------------------------------------------------------
# 13. PARAMETRES TECHNIQUES
# -----------------------------------------------------------------------------
technique:
  log_level: "INFO"

  run:
    id_format: "PRICING_{mode}_{YYYYMMDD}_{HHmmss}"
    metadata:
      - utilisateur
      - mode
      - date_run
      - version_config
      - nombre_produits_traites
      - marge_globale_obtenue
      - portfolio_metrics
