[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-price-optimization"
version = "1.0.0"
description = "Optimisation prix retail SCAFLF Fruits & Legumes"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "requests>=2.31",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
databricks = [
    "pyspark>=3.5",
    "delta-spark>=3.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
